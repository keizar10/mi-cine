# .github/workflows/vod-mensual.yml
#
# El día 1 de cada mes (y cuando lo lances a mano):
#   1. vuelca votos_imdb.csv (tus votos de IMDb) al Excel: notas nuevas, pelis nuevas
#   2. actualiza la columna VOD (películas y series) con TMDB
#   3. recalcula las fórmulas con LibreOffice
#   4. recoge carátulas nuevas y genera datos.json (para la app)
#   5. guarda todo en el repositorio
#   6. sube el Excel sobre el MISMO archivo de Google Drive
#
# SECRETOS: TMDB_API_KEY, GDRIVE_SA_JSON

name: Actualizar VOD y subir a Drive

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
  push:
    paths:
      - 'votos_imdb.csv'

permissions:
  contents: write

env:
  EXCEL: "Movie Data Base by Keizar.xlsx"
  GDRIVE_FILE_ID: "1Io1xGv2muiEILSGprmr1szDzwxOfiWXJ"

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install requests openpyxl google-auth
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc > /dev/null

      - name: Sincronizar votos de IMDb
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python sincronizar_imdb.py

      - name: Actualizar la columna VOD
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python actualizar_vod.py

      - name: Recoger carátulas (TMDB)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python posters.py

      - name: Recalcular fórmulas
        run: python recalcular.py "$EXCEL"

      - name: Generar datos.json
        run: python generar_datos.py

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Actualización $(date +%d/%m/%Y)"
          git push

      - name: Subir la nueva versión a Google Drive
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python subir_drive.py "$EXCEL"
